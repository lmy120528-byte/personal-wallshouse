<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章管理工具 - 张强</title>
    <style>
        :root {
            --bg: #090909; --bg-card: #0f0f0f; --text: #e0e0e0;
            --text-muted: #888; --accent: #5eead4; --border: rgba(255,255,255,0.08);
            --danger: #f87171; --success: #34d399;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .admin-header {
            position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 32px; background: rgba(9,9,9,0.9);
            backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
        }
        .admin-title { font-size: 17px; font-weight: 700; letter-spacing: 0.5px; }
        .admin-title span { color: var(--accent); }
        .btn {
            font-size: 13px; padding: 8px 18px; border-radius: 8px; border: 1px solid var(--border);
            cursor: pointer; font-family: inherit; transition: all 0.2s ease;
            letter-spacing: 0.3px; display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-primary { background: var(--accent); color: #090909; border-color: var(--accent); font-weight: 600; }
        .btn-primary:hover { filter: brightness(1.1); }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; filter: none; }
        .btn-outline { background: transparent; color: var(--text-muted); }
        .btn-outline:hover { border-color: rgba(255,255,255,0.25); color: #fff; }
        .btn-danger { background: transparent; color: var(--danger); border-color: rgba(248,113,113,0.2); }
        .btn-danger:hover { background: rgba(248,113,113,0.1); }
        .btn-sm { font-size: 11px; padding: 4px 10px; }
        .container { max-width: 900px; margin: 0 auto; padding: 32px 24px; }
        .settings-bar {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
            padding: 20px; margin-bottom: 28px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
        }
        .settings-bar label { font-size: 12px; color: var(--text-muted); white-space: nowrap; letter-spacing: 0.3px; }
        .settings-bar input {
            background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
            padding: 6px 12px; color: var(--text); font-size: 12px; font-family: inherit;
            min-width: 180px; flex: 1;
        }
        .settings-bar input:focus { outline: none; border-color: var(--accent); }
        .settings-status { font-size: 11px; padding: 3px 10px; border-radius: 4px; white-space: nowrap; }
        .settings-status.ok { background: rgba(52,211,153,0.1); color: var(--success); }
        .settings-status.missing { background: rgba(248,113,113,0.1); color: var(--danger); }
        .article-block {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
            padding: 24px; margin-bottom: 16px; position: relative;
            transition: border-color 0.2s ease;
        }
        .article-block:hover { border-color: rgba(255,255,255,0.14); }
        .block-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .block-number { font-size: 12px; color: var(--accent); font-weight: 600; letter-spacing: 1px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .form-row.single { grid-template-columns: 1fr; }
        .form-row.triple { grid-template-columns: 1fr 1fr auto; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 11px; color: var(--text-muted); letter-spacing: 0.5px; text-transform: uppercase; }
        .form-group input, .form-group textarea, .form-group select {
            background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
            padding: 8px 12px; color: var(--text); font-size: 14px; font-family: inherit;
            transition: border-color 0.2s ease; resize: vertical;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: var(--accent); }
        .form-group textarea { min-height: 120px; line-height: 1.7; font-size: 13px; }
        .form-group textarea.collapsed { min-height: 60px; }
        .analysis-result { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); display: none; }
        .analysis-result.show { display: block; }
        .result-stats { display: flex; gap: 16px; align-items: center; padding: 8px 0; }
        .stat-badge { font-size: 11px; color: var(--accent); background: rgba(94,234,212,0.08); padding: 4px 10px; border-radius: 4px; letter-spacing: 0.3px; }
        .summary-preview {
            background: rgba(94,234,212,0.04); border: 1px solid rgba(94,234,212,0.1);
            border-radius: 6px; padding: 12px; font-size: 13px; color: var(--text-muted);
            line-height: 1.7; margin-top: 8px;
        }
        .tags-display { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
        .tag-chip { font-size: 11px; padding: 3px 10px; border-radius: 100px; background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid rgba(255,255,255,0.08); }
        .action-bar { display: flex; gap: 12px; margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--border); align-items: center; }
        .action-bar .hint { font-size: 11px; color: var(--text-muted); margin-left: auto; }
        .toast {
            position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
            background: #1a1a1a; border: 1px solid var(--border); border-radius: 10px;
            padding: 12px 24px; font-size: 13px; z-index: 200;
            opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .toast.show { opacity: 1; }
        .toast.success { border-color: rgba(52,211,153,0.3); }
        .toast.error { border-color: rgba(248,113,113,0.3); }
        .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 640px) {
            .form-row { grid-template-columns: 1fr; }
            .settings-bar { flex-direction: column; align-items: stretch; }
            .settings-bar input { min-width: auto; }
            .action-bar { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <header class="admin-header">
        <div class="admin-title">文章管理工具 <span>·</span> Admin</div>
        <div class="header-actions">
            <button class="btn btn-outline btn-sm" onclick="toggleSettings()">⚙ 设置</button>
        </div>
    </header>

    <div class="container">
        <!-- 设置面板 -->
        <div class="settings-bar" id="settingsPanel" style="">
            <label>DeepSeek Key</label>
            <input type="password" id="deepseekKey" placeholder="sk-xxxxxxxxxxxx" oninput="saveSettings()">
            <span class="settings-status" id="deepseekStatus">未设置</span>

            <label>GitHub Token</label>
            <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxx" oninput="saveSettings()">
            <span class="settings-status" id="githubStatus">未设置</span>

            <div style="width:100%;border-top:1px solid var(--border);margin:4px 0;"></div>
            <span style="font-size:11px;color:var(--text-muted);">
                DeepSeek Key 用于本地 AI 分析，部署 Vercel 后改用环境变量 DEEPSEEK_API_KEY
                &nbsp;·&nbsp;
                GitHub Token 需要 repo 权限 <a href="https://github.com/settings/tokens" target="_blank" style="color:var(--accent);">创建 Token →</a>
            </span>
        </div>

        <!-- 文章编辑区 -->
        <div id="articlesContainer"></div>

        <!-- 添加按钮 -->
        <button class="btn btn-outline" onclick="addArticle()" style="width:100%; justify-content:center; padding:14px;">
            ＋ 添加文章
        </button>

        <!-- 操作栏 -->
        <div class="action-bar">
            <button class="btn btn-primary" id="btnAnalyze" onclick="analyzeArticles()">
                🔍 分析文章
            </button>
            <button class="btn btn-primary" id="btnDeploy" onclick="deployToGitHub()" disabled>
                🚀 推送部署
            </button>
            <span class="hint" id="actionHint"></span>
        </div>

        <!-- 预览区 -->
        <div id="previewSection" style="margin-top:32px; display:none;">
            <div style="font-size:12px; color:var(--text-muted); margin-bottom:8px; letter-spacing:0.5px;">
                生成的数据预览（新文章在前）
            </div>
            <pre id="previewContent" style="
                background:var(--bg-card); border:1px solid var(--border);
                border-radius:10px; padding:20px; font-size:12px;
                line-height:1.6; overflow-x:auto; max-height:400px;
                overflow-y:auto; color:var(--text-muted);
            "></pre>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ===== 全局状态 =====
        var articleCount = 0;

        // ===== 初始化 =====
        function init() {
            loadSettings();
            addArticle();
        }

        // ===== 设置管理 =====
        function loadSettings() {
            document.getElementById('githubToken').value = localStorage.getItem('github_token') || '';
            document.getElementById('deepseekKey').value = localStorage.getItem('deepseek_key') || '';
            updateSettingsStatus();
        }

        function saveSettings() {
            localStorage.setItem('github_token', document.getElementById('githubToken').value.trim());
            localStorage.setItem('deepseek_key', document.getElementById('deepseekKey').value.trim());
            updateSettingsStatus();
            showToast('设置已保存', 'success');
        }

        function toggleSettings() {
            var panel = document.getElementById('settingsPanel');
            panel.style.display = panel.style.display === 'none' ? '' : 'none';
        }

        function updateSettingsStatus() {
            var hasGh = !!document.getElementById('githubToken').value.trim();
            var hasDs = !!document.getElementById('deepseekKey').value.trim();
            var gs = document.getElementById('githubStatus');
            var ds = document.getElementById('deepseekStatus');
            gs.textContent = hasGh ? '已设置 OK' : '未设置';
            gs.className = 'settings-status ' + (hasGh ? 'ok' : 'missing');
            ds.textContent = hasDs ? '已设置 OK' : '未设置';
            ds.className = 'settings-status ' + (hasDs ? 'ok' : 'missing');
        }

        function getGitHubToken() { return document.getElementById('githubToken').value.trim(); }
        function getDeepSeekKey() { return document.getElementById('deepseekKey').value.trim(); }

        // ===== 文章块管理 =====
        function addArticle() {
            articleCount++;
            var id = 'article-' + articleCount;
            var html = '<div class="article-block" id="' + id + '">'
                + '<div class="block-header">'
                + '<span class="block-number">文章 #' + articleCount + '</span>'
                + '<button class="btn btn-danger btn-sm" onclick="removeArticle(\'' + id + '\')">移除</button>'
                + '</div>'
                + '<div class="form-row triple">'
                + '<div class="form-group"><label>系列</label>'
                + '<select class="series-select"><option value="geo">GEO 实战</option><option value="ai">白话 AI</option></select></div>'
                + '<div class="form-group"><label>发布时间</label><input type="date" class="date-input"></div>'
                + '<div class="form-group"><label>公众号链接</label><input type="url" class="url-input" placeholder="https://mp.weixin.qq.com/s/..."></div>'
                + '</div>'
                + '<div class="form-row single"><div class="form-group"><label>文章标题</label><input type="text" class="title-input" placeholder="输入文章标题"></div></div>'
                + '<div class="form-row single"><div class="form-group"><label>全文内容（从公众号复制粘贴）</label><textarea class="content-input collapsed" placeholder="粘贴文章全文内容..." onfocus="this.classList.remove(\'collapsed\')"></textarea></div></div>'
                + '<div class="analysis-result">'
                + '<div style="font-size:11px;color:var(--text-muted);margin-bottom:6px;letter-spacing:0.5px;">分析结果</div>'
                + '<div class="result-stats"><span class="stat-badge word-count">0 字</span><span class="stat-badge read-time">约 0 分钟</span></div>'
                + '<div class="tags-display"></div>'
                + '<div class="summary-preview" contenteditable="true">等待分析...</div>'
                + '</div></div>';

            document.getElementById('articlesContainer').insertAdjacentHTML('beforeend', html);
            updateDeployButton();
        }

        function removeArticle(id) {
            var el = document.getElementById(id);
            if (el) el.remove();
            updateDeployButton();
        }

        // ===== 收集文章数据 =====
        function collectArticles() {
            var articles = [];
            document.querySelectorAll('.article-block').forEach(function(block) {
                var title = block.querySelector('.title-input').value.trim();
                var content = block.querySelector('.content-input').value.trim();
                if (title || content) {
                    articles.push({
                        series: block.querySelector('.series-select').value,
                        date: block.querySelector('.date-input').value,
                        url: block.querySelector('.url-input').value.trim(),
                        title: title,
                        content: content
                    });
                }
            });
            return articles;
        }

        // ===== 字数计算（中文按字符，英文按单词） =====
        function countWords(text) {
            var cleaned = text.replace(/\s+/g, '').replace(/[^一-鿿\w]/g, '');
            var chineseChars = (cleaned.match(/[一-鿿]/g) || []).length;
            var englishWords = cleaned.replace(/[一-鿿]/g, ' ').trim().split(/\s+/).filter(Boolean).length;
            return chineseChars + englishWords;
        }

        function calcReadingTime(wordCount) {
            return Math.max(1, Math.round(wordCount / 250));
        }

        // ===== 分析文章 =====
        async function analyzeArticles() {
            var articles = collectArticles();
            if (articles.length === 0) { showToast('请至少填写一篇文章的内容', 'error'); return; }

            var hasContent = articles.some(function(a) { return a.content.length > 0; });
            if (!hasContent) { showToast('请至少为一篇文章粘贴全文内容', 'error'); return; }

            var btn = document.getElementById('btnAnalyze');
            var origHTML = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> 分析中...';
            document.getElementById('actionHint').textContent = '正在调用 DeepSeek AI 分析...';

            try {
                // 客户端计算字数 + 阅读时长
                var clientResults = articles.map(function(a) {
                    var wc = a.content ? countWords(a.content) : 0;
                    return { wordCount: wc, readingTime: calcReadingTime(wc), summary: '', tags: [] };
                });

                // 调用 AI 获取摘要和标签
                var aiResults = null;
                try {
                    aiResults = await callDeepSeekAPI(articles);
                } catch (apiErr) {
                    var errMsg = apiErr.message || '未知错误';
                    console.error('DeepSeek 调用失败:', errMsg);
                    // 显示具体错误原因
                    showToast('分析失败: ' + errMsg, 'error');
                    // 同时复制到剪贴板作为备用
                    var fallback = buildFallbackPrompt(articles);
                    try { await navigator.clipboard.writeText(fallback); } catch(e) {}
                }

                // 合并结果更新 UI
                updateAnalysisUI(clientResults, aiResults);
                document.getElementById('btnDeploy').disabled = false;
                document.getElementById('actionHint').textContent = aiResults
                    ? 'AI 分析完成！检查后可推送部署'
                    : '字数已计算，标签和摘要请手动填写或粘贴 AI 结果';

            } catch (err) {
                showToast('分析出错: ' + err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = origHTML;
            }
        }

        // 调用 DeepSeek API（兼容 OpenAI 格式）
        async function callDeepSeekAPI(articles) {
            var apiKey = getDeepSeekKey();
            if (!apiKey) throw new Error('未设置 DeepSeek API Key，请在设置中填入');

            // 只分析有内容的文章
            var toAnalyze = articles.filter(function(a) { return a.content.length > 0; });
            if (toAnalyze.length === 0) return [];

            // 构建 Prompt
            var articlesText = toAnalyze.map(function(a, i) {
                return '【文章' + (i + 1) + '】\n标题：' + (a.title || '无标题') + '\n全文：\n' + a.content + '\n';
            }).join('\n---\n\n');

            var systemPrompt = [
                '你是专业内容编辑助手，为技术文章写摘要和标签。',
                '',
                '为每篇文章生成：',
                '1. 摘要（summary）：1-2句话概括文章核心内容，不超过80字，直击要点，中文',
                '2. 标签（tags）：1-2个精准标签，根据文章实际内容提炼，用简洁的中文短语',
                '',
                '标签要求：',
                '- 从文章中提取最核心的关键词作为标签，如"GEO优化"、"Prompt设计"等',
                '- 标签要具体、有辨识度，不要用太宽泛的词如"技术"、"方法"',
                '- 严格1-2个，宁少勿多',
                '',
                '摘要要求：不要写"本文介绍了..."这样的开头，直接说核心观点',
                '',
                '只返回JSON数组，不要任何markdown标记或额外文字。',
                '格式：[{"summary": "...", "tags": ["标签1", "标签2"]}, ...]'
            ].join('\n');

            var userPrompt = '请分析以下' + toAnalyze.length + '篇文章：\n\n' + articlesText + '\n只返回JSON数组，不要其他文字：';

            // 通过本地代理发送（绕过浏览器 CORS 限制）
            var resp = await fetch('http://localhost:8081/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    api_key: apiKey,
                    model: 'deepseek-chat',
                    temperature: 0.3,
                    max_tokens: 2000,
                    messages: [
                        { role: 'system', content: systemPrompt },
                        { role: 'user', content: userPrompt }
                    ]
                })
            });

            if (!resp.ok) {
                var errText = '';
                try { errText = await resp.text(); } catch(e) {}
                throw new Error('DeepSeek API 返回错误 ' + resp.status + ': ' + errText);
            }

            var data = await resp.json();
            var text = data.choices[0].message.content;
            var jsonStr = text.replace(/```json\s*/g, '').replace(/```\s*/g, '').trim();

            var results;
            try {
                results = JSON.parse(jsonStr);
            } catch (parseErr) {
                throw new Error('AI 返回格式异常: ' + jsonStr.substring(0, 200));
            }

            if (!Array.isArray(results)) {
                throw new Error('AI 返回不是数组: ' + jsonStr.substring(0, 200));
            }

            // 补齐：确保返回结果数量匹配
            while (results.length < toAnalyze.length) {
                results.push({ summary: '', tags: [] });
            }
            return results.slice(0, toAnalyze.length);
        }

        // 降级方案：构建分析 prompt（复制到剪贴板发给 Claude）
        function buildFallbackPrompt(articles) {
            var prompt = '请分析以下' + articles.length + '篇文章，为每篇生成摘要(1-2句话)和标签(1-2个)：\n\n';
            articles.forEach(function(a, i) {
                prompt += '【文章' + (i + 1) + '】' + (a.title ? '\n标题: ' + a.title : '') + '\n内容:\n' + a.content + '\n\n---\n\n';
            });
            prompt += '\n返回JSON数组: [{"summary": "...", "tags": ["标签1", "标签2"]}, ...]';
            return prompt;
        }

        // 更新分析结果 UI
        function updateAnalysisUI(clientResults, aiResults) {
            var blocks = document.querySelectorAll('.article-block');
            blocks.forEach(function(block, i) {
                var cr = clientResults[i] || { wordCount: 0, readingTime: 0 };
                var ar = (aiResults && aiResults[i]) ? aiResults[i] : { summary: '', tags: [] };

                var resultDiv = block.querySelector('.analysis-result');
                resultDiv.classList.add('show');

                block.querySelector('.word-count').textContent = formatWords(cr.wordCount);
                block.querySelector('.read-time').textContent = '约 ' + cr.readingTime + ' 分钟';

                var tagsHtml = '';
                if (ar.tags && ar.tags.length > 0) {
                    tagsHtml = ar.tags.map(function(t) {
                        return '<span class="tag-chip" contenteditable="true">' + t + '</span>';
                    }).join('');
                } else {
                    tagsHtml = '<span class="tag-chip" contenteditable="true" style="border-style:dashed;">点击添加标签</span>';
                }
                block.querySelector('.tags-display').innerHTML = tagsHtml;

                var summaryDiv = block.querySelector('.summary-preview');
                summaryDiv.textContent = ar.summary || '(手动输入摘要，或等待 AI 分析)';
            });
        }

        function formatWords(n) {
            if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k 字';
            return n + ' 字';
        }

        // ===== 收集最终文章数据 =====
        function collectFinalArticles() {
            var articles = [];
            document.querySelectorAll('.article-block').forEach(function(block) {
                var title = block.querySelector('.title-input').value.trim();
                if (!title) return;

                var tags = [];
                block.querySelectorAll('.tag-chip').forEach(function(chip) {
                    var t = chip.textContent.trim();
                    if (t && t !== '点击添加标签') tags.push(t);
                });

                var wcText = block.querySelector('.word-count').textContent;
                var wcMatch = wcText.match(/([\d.]+)k?/);
                var wc = wcMatch ? (wcText.includes('k') ? parseFloat(wcMatch[1]) * 1000 : parseInt(wcMatch[1])) : 0;

                var rtText = block.querySelector('.read-time').textContent;
                var rtMatch = rtText.match(/(\d+)/);
                var rt = rtMatch ? parseInt(rtMatch[1]) : 0;

                articles.push({
                    series: block.querySelector('.series-select').value,
                    seriesName: block.querySelector('.series-select').value === 'geo' ? 'GEO 实战' : '白话 AI',
                    title: title,
                    date: block.querySelector('.date-input').value,
                    summary: block.querySelector('.summary-preview').textContent.trim(),
                    wordCount: wc,
                    readingTime: rt,
                    tags: tags,
                    url: block.querySelector('.url-input').value.trim()
                });
            });
            return articles;
        }

        // ===== 生成 articles-data.js =====
        function generateDataFile(allArticles) {
            var lines = [
                '/**',
                ' * 文章数据中心',
                ' * 新增文章：在数组中加一条记录即可，GitHub push 后 Vercel 自动更新',
                ' */',
                'var articles = ['
            ];

            var geoArticles = allArticles.filter(function(a) { return a.series === 'geo'; });
            var aiArticles = allArticles.filter(function(a) { return a.series === 'ai'; });

            function writeGroup(label, group, isLast) {
                if (group.length === 0) return;
                lines.push('');
                lines.push('    // ===== ' + label + ' =====');
                group.forEach(function(a, idx) {
                    var isLastItem = isLast && idx === group.length - 1;
                    var summary = (a.summary || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, ' ');
                    var title = (a.title || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
                    var tagsStr = JSON.stringify(a.tags || []);
                    lines.push('    {');
                    lines.push("        series: '" + a.series + "',");
                    lines.push("        seriesName: '" + a.seriesName + "',");
                    lines.push("        title: '" + title + "',");
                    lines.push("        date: '" + (a.date || '') + "',");
                    lines.push("        summary: '" + summary + "',");
                    lines.push("        wordCount: " + (a.wordCount || 0) + ",");
                    lines.push("        readingTime: " + (a.readingTime || 0) + ",");
                    lines.push("        tags: " + tagsStr + ",");
                    lines.push("        url: '" + (a.url || '') + "'");
                    lines.push('    }' + (isLastItem ? '' : ','));
                });
            }

            writeGroup('GEO 实战', geoArticles, aiArticles.length === 0);
            writeGroup('白话 AI', aiArticles, true);

            lines.push('');
            lines.push('];');
            lines.push('');
            return lines.join('\n');
        }

        // ===== GitHub 推送 =====
        async function deployToGitHub() {
            var token = getGitHubToken();
            if (!token) {
                showToast('请先在设置中填写 GitHub Token', 'error');
                toggleSettings();
                document.getElementById('settingsPanel').scrollIntoView({ behavior: 'smooth' });
                return;
            }

            var newArticles = collectFinalArticles();
            if (newArticles.length === 0) { showToast('请添加有效的文章数据', 'error'); return; }

            // ---- 确认弹窗 ----
            var confirmMsg = '确认将以下 ' + newArticles.length + ' 篇文章部署到网站？\n\n';
            newArticles.forEach(function(a, i) {
                confirmMsg += (i + 1) + '. ' + a.title + '\n';
                confirmMsg += '   系列: ' + a.seriesName + ' | ' + (a.date || '无日期') + ' | ' + formatWords(a.wordCount) + '\n';
                confirmMsg += '   标签: ' + (a.tags && a.tags.length > 0 ? a.tags.join('、') : '无') + '\n\n';
            });
            confirmMsg += '推送后 Vercel 将自动部署，网站即刻更新。';

            if (!confirm(confirmMsg)) {
                document.getElementById('actionHint').textContent = '已取消';
                return;
            }

            var btn = document.getElementById('btnDeploy');
            var origHTML = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> 推送中...';

            var owner = 'lmy120528-byte';
            var repo = 'personal-wallshouse';
            var path = 'articles-data.js';

            try {
                document.getElementById('actionHint').textContent = '读取现有数据...';
                var getResp = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + path, {
                    headers: {
                        'Authorization': 'token ' + token,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                var existingArticles = [];
                var sha = null;

                if (getResp.ok) {
                    var fileData = await getResp.json();
                    sha = fileData.sha;
                    var rawContent = decodeURIComponent(escape(atob(fileData.content)));
                    existingArticles = parseExistingArticles(rawContent);
                    document.getElementById('actionHint').textContent = '现有 ' + existingArticles.length + ' 篇 + 新增 ' + newArticles.length + ' 篇';
                } else {
                    document.getElementById('actionHint').textContent = '新建文件，共 ' + newArticles.length + ' 篇文章';
                }

                // 合并（新文章在前）
                var allArticles = newArticles.concat(existingArticles);
                var newContent = generateDataFile(allArticles);

                // 显示预览
                document.getElementById('previewSection').style.display = 'block';
                document.getElementById('previewContent').textContent = newContent;
                document.getElementById('previewSection').scrollIntoView({ behavior: 'smooth' });

                // 推送
                document.getElementById('actionHint').textContent = '推送到 GitHub...';
                var putBody = {
                    message: '新增文章: ' + newArticles.map(function(a) { return a.title; }).join(', '),
                    content: btoa(unescape(encodeURIComponent(newContent)))
                };
                if (sha) putBody.sha = sha;

                var putResp = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + path, {
                    method: 'PUT',
                    headers: {
                        'Authorization': 'token ' + token,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify(putBody)
                });

                if (putResp.ok) {
                    showToast('推送成功！线上 Vercel 自动部署，本地需 git pull 同步', 'success');
                    document.getElementById('actionHint').textContent = '完成！线上 ' + newArticles.length + ' 篇已部署。本地查看请执行 git pull';
                } else {
                    var errData = await putResp.json();
                    throw new Error(errData.message || '推送失败');
                }
            } catch (err) {
                showToast('推送失败: ' + err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = origHTML;
            }
        }

        // 解析现有 articles-data.js
        function parseExistingArticles(jsText) {
            try {
                var fn = new Function(jsText + '; return articles;');
                var articles = fn();
                if (Array.isArray(articles)) {
                    return articles.map(function(a) {
                        return {
                            series: a.series || '', seriesName: a.seriesName || '',
                            title: a.title || '', date: a.date || '', summary: a.summary || '',
                            wordCount: a.wordCount || 0, readingTime: a.readingTime || 0,
                            tags: a.tags || [], url: a.url || ''
                        };
                    });
                }
            } catch(e) { console.warn('解析现有文章失败:', e); }
            return [];
        }

        function updateDeployButton() {
            var articles = collectArticles();
            document.getElementById('btnDeploy').disabled = !articles.some(function(a) { return a.title.trim().length > 0; });
        }

        // ===== Toast =====
        var toastTimer;
        function showToast(msg, type) {
            var el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast ' + (type || '') + ' show';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function() { el.classList.remove('show'); }, 3000);
        }

        document.addEventListener('input', function(e) {
            if (e.target.closest('.article-block')) updateDeployButton();
        });

        init();
    </script>
</body>
