# Render Blueprint — 自动部署配置
# 文档：https://render.com/docs/blueprint-spec
services:
  - type: web
    name: zhangqiang-agent
    runtime: python
    rootDir: rag-backend
    buildCommand: pip install -r requirements.txt
    startCommand: python3 start.py
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false  # 手动在 Render 后台设置，不提交到 git
