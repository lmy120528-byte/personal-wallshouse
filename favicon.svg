  <text x="32" y="49.5" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="50" font-weight="800" fill="#ffffff">七</text>
</svg>
