<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>张强的数字分身 - 对话</title>
    <style>
        :root {
            --bg: #090909;
            --bg-card: #0f0f0f;
            --text: #e0e0e0;
            --text-muted: #888;
            --accent: #5eead4;
            --border: rgba(255,255,255,0.08);
            --bubble-user: #1a2a1e;
            --bubble-agent: #0f0f0f;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* 顶栏 */
        .chat-header {
            flex-shrink: 0; padding: 12px 20px;
            background: rgba(9,9,9,0.9); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; z-index: 10;
        }
        .chat-header-left { display: flex; align-items: center; gap: 10px; }
        .chat-avatar {
            width: 32px; height: 32px; border-radius: 8px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; color: #fff;
        }
        .chat-title { font-size: 14px; font-weight: 600; }
        .chat-subtitle { font-size: 11px; color: var(--text-muted); }
        .chat-header-right { display: flex; align-items: center; gap: 12px; }
        .key-status {
            font-size: 10px; padding: 2px 8px; border-radius: 4px;
            background: rgba(248,113,113,0.1); color: #f87171;
            cursor: pointer; border: 1px solid rgba(248,113,113,0.2);
            transition: all 0.2s ease;
        }
        .key-status.ok { background: rgba(52,211,153,0.1); color: #34d399; border-color: rgba(52,211,153,0.2); }

        /* 消息区 */
        .chat-messages {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 16px;
        }
        .message {
            display: flex; gap: 10px; max-width: 85%;
            animation: fadeUp 0.3s ease-out;
        }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.agent { align-self: flex-start; }

        .msg-avatar {
            width: 30px; height: 30px; border-radius: 6px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 600;
        }
        .message.user .msg-avatar { background: rgba(255,255,255,0.08); color: var(--text-muted); }
        .message.agent .msg-avatar {
            background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff;
        }

        .msg-bubble {
            padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.7;
            border: 1px solid var(--border);
        }
        .message.user .msg-bubble { background: var(--bubble-user); border-radius: 12px 12px 4px 12px; }
        .message.agent .msg-bubble { background: var(--bubble-agent); border-radius: 12px 12px 12px 4px; }

        .msg-sources {
            margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.06);
            font-size: 11px; color: var(--text-muted);
            display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
        }
        .msg-sources span { opacity: 0.5; }
        .source-chip {
            font-size: 10px; padding: 2px 8px; border-radius: 100px;
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
            color: var(--text-muted);
        }

        /* 思考中 */
        .thinking .msg-bubble {
            display: flex; gap: 4px; align-items: center; padding: 16px;
        }
        .thinking .msg-bubble span {
            width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted);
            animation: dotPulse 1.4s ease-in-out infinite;
        }
        .thinking .msg-bubble span:nth-child(2) { animation-delay: 0.2s; }
        .thinking .msg-bubble span:nth-child(3) { animation-delay: 0.4s; }

        /* 输入区 */
        .chat-input-area {
            flex-shrink: 0; padding: 16px 20px 20px;
            background: rgba(9,9,9,0.9); backdrop-filter: blur(12px);
            border-top: 1px solid var(--border);
        }
        .chat-input-wrap {
            display: flex; gap: 10px; align-items: flex-end;
            max-width: 900px; margin: 0 auto;
        }
        .chat-input-wrap textarea {
            flex: 1; background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 10px; padding: 10px 14px; color: var(--text);
            font-size: 14px; font-family: inherit; line-height: 1.5;
            resize: none; min-height: 42px; max-height: 120px;
            transition: border-color 0.2s ease;
        }
        .chat-input-wrap textarea:focus { outline: none; border-color: var(--accent); }
        .chat-input-wrap textarea::placeholder { color: rgba(255,255,255,0.2); }

        .send-btn {
            width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--accent);
            background: var(--accent); color: #090909; cursor: pointer;
            font-size: 18px; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease; flex-shrink: 0;
        }
        .send-btn:hover { filter: brightness(1.1); }
        .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .api-key-hint {
            text-align: center; font-size: 11px; color: var(--text-muted);
            margin-top: 8px; cursor: pointer;
        }
        .api-key-hint:hover { color: #ccc; }

        /* 设置弹窗 */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            display: flex; align-items: center; justify-content: center;
            z-index: 100; display: none;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 16px; padding: 28px; max-width: 420px; width: 90%;
        }
        .modal h3 { font-size: 16px; margin-bottom: 16px; }
        .modal input {
            width: 100%; background: var(--bg); border: 1px solid var(--border);
            border-radius: 8px; padding: 10px 14px; color: var(--text);
            font-size: 13px; font-family: inherit; margin-bottom: 12px;
        }
        .modal input:focus { outline: none; border-color: var(--accent); }
        .modal .btn-row { display: flex; gap: 8px; justify-content: flex-end; }
        .modal .btn {
            font-size: 13px; padding: 8px 18px; border-radius: 8px;
            cursor: pointer; font-family: inherit; border: 1px solid var(--border);
            background: transparent; color: var(--text-muted); transition: all 0.2s ease;
        }
        .modal .btn.primary { background: var(--accent); color: #090909; border-color: var(--accent); font-weight: 600; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } }
        @keyframes dotPulse { 0%,60%,100% { opacity: 0.2; } 30% { opacity: 1; } }
    </style>
</head>
<body>

    <!-- 顶栏 -->
    <div class="chat-header">
        <div class="chat-header-left">
            <div class="chat-avatar">强</div>
            <div>
                <div class="chat-title">张强的数字分身</div>
                <div class="chat-subtitle">基于真实经历和思考回答</div>
            </div>
        </div>
        <div class="chat-header-right">
            <span class="key-status" id="keyStatus" onclick="showSettings()">未设置 Key</span>
        </div>
    </div>

    <!-- 消息列表 -->
    <div class="chat-messages" id="messages">
        <div class="message agent">
            <div class="msg-avatar">强</div>
            <div class="msg-bubble">
                你好，我是张强的数字分身。<br>
                你可以直接问我任何关于他的问题——比如他的经历、对 GEO 的看法、做过的项目，或者任何你想了解的。<br><br>
                试试问：<br>
                • "你怎么看 GEO 的未来？"<br>
                • "讲讲你在百度做过的项目"<br>
                • "RAG 技术是什么？有什么缺陷？"
            </div>
        </div>
    </div>

    <!-- 输入区 -->
    <div class="chat-input-area">
        <div class="chat-input-wrap">
            <textarea id="userInput" placeholder="输入你的问题..." rows="1"
                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">→</button>
        </div>
        <div class="api-key-hint" onclick="showSettings()">
            DeepSeek Key: <span id="keyLabel">未设置</span>（点击设置）
        </div>
    </div>

    <!-- 设置弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3>⚙ 设置 DeepSeek API Key</h3>
            <input type="password" id="keyInput" placeholder="sk-xxxxxxxxxxxx">
            <div style="font-size:11px;color:var(--text-muted);margin-bottom:12px;">
                Key 仅保存在浏览器本地，不会上传到任何服务器
            </div>
            <div class="btn-row">
                <button class="btn" onclick="hideSettings()">取消</button>
                <button class="btn primary" onclick="saveSettings()">保存</button>
            </div>
        </div>
    </div>

    <script>
        // ===== 状态 =====
        const API_URL = 'http://localhost:8000/chat';
        let sessionId = 'chat-' + Date.now();

        // ===== 初始化 =====
        function init() {
            const key = localStorage.getItem('deepseek_key');
            if (key) {
                document.getElementById('keyInput').value = key;
                updateKeyStatus();
            }
            document.getElementById('userInput').focus();
        }

        // ===== 设置面板 =====
        function showSettings() {
            document.getElementById('keyInput').value = localStorage.getItem('deepseek_key') || '';
            document.getElementById('modalOverlay').classList.add('show');
            document.getElementById('keyInput').focus();
        }
        function hideSettings() { document.getElementById('modalOverlay').classList.remove('show'); }
        function saveSettings() {
            const key = document.getElementById('keyInput').value.trim();
            if (key) localStorage.setItem('deepseek_key', key);
            else localStorage.removeItem('deepseek_key');
            updateKeyStatus();
            hideSettings();
        }
        function getKey() { return localStorage.getItem('deepseek_key') || ''; }
        function updateKeyStatus() {
            const has = !!getKey();
            const el = document.getElementById('keyStatus');
            el.textContent = has ? 'Key 已设置' : '未设置 Key';
            el.className = 'key-status' + (has ? ' ok' : '');
            document.getElementById('keyLabel').textContent = has ? getKey().substring(0,8) + '...' : '未设置';
        }

        // ===== 发送消息 =====
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            const key = getKey();
            if (!key) { showSettings(); return; }

            // 添加用户消息
            addMessage('user', text);
            input.value = '';
            input.style.height = 'auto';

            // 添加"思考中"
            const thinkingEl = addThinking();

            // 滚动到底
            scrollBottom();

            // 禁用发送
            document.getElementById('sendBtn').disabled = true;
            document.getElementById('userInput').disabled = true;

            try {
                const resp = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, session_id: sessionId, deepseek_key: key })
                });
                const data = await resp.json();

                // 移除思考中
                thinkingEl.remove();

                // 添加 Agent 回复
                addMessage('agent', data.answer, data.sources || []);

            } catch (err) {
                thinkingEl.remove();
                addMessage('agent', '连接失败：请确认 main.py 已启动（python3 main.py）\n\n错误：' + err.message);
            } finally {
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('userInput').disabled = false;
                document.getElementById('userInput').focus();
                scrollBottom();
            }
        }

        // ===== UI 操作 =====
        function addMessage(role, text, sources) {
            const container = document.getElementById('messages');

            const el = document.createElement('div');
            el.className = 'message ' + role;

            const avatar = role === 'user' ? '我' : '强';

            // 简单 Markdown 渲染（换行 + 列表）
            let html = text
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n/g, '<br>');
            html = '<p>' + html + '</p>';

            let sourcesHtml = '';
            if (sources && sources.length > 0) {
                sourcesHtml = '<div class="msg-sources"><span>参考</span>' +
                    sources.map(s => '<span class="source-chip">' + s + '</span>').join('') +
                    '</div>';
            }

            el.innerHTML = '<div class="msg-avatar">' + avatar + '</div>' +
                '<div><div class="msg-bubble">' + html + '</div>' + sourcesHtml + '</div>';

            container.appendChild(el);
        }

        function addThinking() {
            const container = document.getElementById('messages');
            const el = document.createElement('div');
            el.className = 'message agent thinking';
            el.innerHTML = '<div class="msg-avatar">强</div>' +
                '<div><div class="msg-bubble"><span></span><span></span><span></span></div></div>';
            container.appendChild(el);
            return el;
        }

        function scrollBottom() {
            const el = document.getElementById('messages');
            setTimeout(() => { el.scrollTop = el.scrollHeight; }, 50);
        }

        // 自动调整输入框高度
        document.getElementById('userInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // 点击遮罩关闭
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) hideSettings();
        });

        init();
    </script>
</body>
</html>
