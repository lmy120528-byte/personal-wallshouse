    <script>
        // 打字机效果：逐行打出标签，最终全部显示
        const tags = [
            '前百度高级产品经理',
            'ToB 业务线负责人',
            'GEO 增长架构师',
            '白话 AI 创作者',
            '产品思维实践者'
        ];
        const container = document.getElementById('heroSubtitle');
        let tagIndex = 0;
        let charIndex = 0;
        let currentLine = null;
        const typeSpeed = 60;  // 每个字的打字速度（ms）
        const lineDelay = 300; // 换行后的停顿（ms）

        function typeWriter() {
            // 开始打新的一行
            if (charIndex === 0) {
                currentLine = document.createElement('span');
                currentLine.className = 'tag-line';
                container.appendChild(currentLine);
            }

            // 打当前字
            currentLine.textContent += tags[tagIndex][charIndex];
            charIndex++;

            // 当前行打完
            if (charIndex >= tags[tagIndex].length) {
                tagIndex++;
                charIndex = 0;

                // 还有下一行
                if (tagIndex < tags.length) {
                    setTimeout(typeWriter, lineDelay);
                } else {
                    // 全部打完，闪烁光标消失
                    container.classList.add('done');
                }
                return;
            }

            setTimeout(typeWriter, typeSpeed);
        }

        // 标题第二行动画结束后开始打字（约 1.5s）
        setTimeout(typeWriter, 1600);
    </script>
